<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="widget.css"><style>
html, body { width: 128px; height: 128px; overflow: hidden; background: transparent; }
.bg { width: 128px; height: 128px; border-radius: 0; background: #1E1E1E; position: relative; overflow: hidden; }
.card { position: absolute; left: 20px; top: 26px; width: 88px; height: 78px; background: #fff; border-radius: 12px; overflow: hidden; }
.card .h { height: 22px; background: #14AE5C; }
.card .r { height: 18px; display: flex; align-items: center; gap: 6px; padding-left: 8px; border-top: 1px solid #eee; }
.card .r i { font-size: 10px; width: 12px; text-align: center; }
.card .r span { height: 6px; border-radius: 3px; background: #c9c9c9; }
.spark { position: absolute; right: 10px; top: 8px; width: 38px; height: 38px; border-radius: 50%; background: #9747FF; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 3px solid #1E1E1E; }
</style></head><body><div class="bg">
  <div class="card"><div class="h"></div>
    <div class="r"><i class="fa-solid fa-key k"></i><span style="width:34px"></span></div>
    <div class="r"><i class="fa-solid fa-link f"></i><span style="width:48px"></span></div>
    <div class="r"><i></i><span style="width:28px"></span></div>
  </div>
  <div class="spark"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
</div></body></html>
